version: '3.8'

services:
  # ============================================================================
  # MASTER NODE
  # ============================================================================
  master:
    build:
      context: .
      dockerfile: Dockerfile.master
    container_name: pso-batch-master
    ports:
      - "8080:8080"
    environment:
      - MASTER_PORT=8080
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    networks:
      - pso-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/metrics"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    depends_on: []

  # ============================================================================
  # WORKER NODES
  # ============================================================================
  worker-1:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: pso-batch-worker-1
    ports:
      - "9001:9001"
    environment:
      - WORKER_ID=worker-1
      - WORKER_PORT=9001
      - MASTER_URL=http://master:8080
      - RUNNING_IN_DOCKER=tru
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    networks:
      - pso-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9001/api/v1/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      master:
        condition: service_healthy
    restart: on-failure

  worker-2:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: pso-batch-worker-2
    ports:
      - "9002:9002"
    environment:
      - WORKER_ID=worker-2
      - WORKER_PORT=9002
      - MASTER_URL=http://master:8080
      - RUNNING_IN_DOCKER=tru
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    networks:
      - pso-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9002/api/v1/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      master:
        condition: service_healthy
    restart: on-failure

  worker-3:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: pso-batch-worker-3
    ports:
      - "9003:9003"
    environment:
      - WORKER_ID=worker-3
      - WORKER_PORT=9003
      - MASTER_URL=http://master:8080
      - RUNNING_IN_DOCKER=tru
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    networks:
      - pso-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9003/api/v1/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      master:
        condition: service_healthy
    restart: on-failure

  # ============================================================================
  # CLIENT (Optional - para pruebas)
  # ============================================================================
  client:
    build:
      context: .
      dockerfile: Dockerfile.client
    container_name: pso-batch-client
    environment:
      - MASTER_URL=http://master:8080
    volumes:
      - ./data:/app/data
      - ./examples:/app/examples
      - ./logs:/app/logs
    networks:
      - pso-network
    depends_on:
      master:
        condition: service_healthy
    # Comando por defecto: ver workers
    command: workers
    stdin_open: true
    tty: true

networks:
  pso-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  data:
    driver: local
  logs:
    driver: local